name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: michael-borck/actions/.github/workflows/tauri-release.yml@main
    secrets: inherit
    with:
      product-name: Karaoke Stage
      preflight-command: npm run typecheck
      updater: false
